[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.2,<2",
    "psycopg[binary]>=3.3,<4",
    "langchain-core>=1.7,<2",
    "langchain-text-splitters>=1.1,<2",
    "pypdf>=6.21,<7",
]

[project.optional-dependencies]
ollama = ["langchain-ollama>=1.1,<2"]
dev = ["pytest>=9.1,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib -m 'not integration'"
markers = [
    "integration: needs a live database and Ollama (run with: pytest -m integration)",
]
