[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.2,<2",
    "psycopg[binary]>=3.3,<4",
    "langchain-core>=1.7,<2",
    "langchain-text-splitters>=1.1,<2",
    "pypdf>=6.21,<7",
]

[project.optional-dependencies]
ollama = ["langchain-ollama>=1.1,<2"]
pgvector = ["langchain-postgres>=0.0.19,<0.1", "asyncpg>=0.32,<1"]
api = ["fastapi>=0.162,<1", "uvicorn>=0.54,<1"]
dev = ["pytest>=9.1,<10", "httpx>=0.28,<1"]  # httpx: FastAPI's TestClient

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib -m 'not integration'"
markers = [
    "integration: needs the local Docker database (docker compose up -d) and Ollama with both models (run with: pytest -m integration)",
]
