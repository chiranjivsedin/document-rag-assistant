[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv",
    "psycopg[binary]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib -m 'not integration'"
markers = [
    "integration: needs a live database and Ollama (run with: pytest -m integration)",
]
